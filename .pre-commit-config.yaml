exclude: ^third_party/

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff
        name: Ruff
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        files: \.pyi?$
        pass_filenames: false
