services:
  worker:
    # Keep a single malformed or unusually expensive media job from exhausting
    # the host. Memory swap equals the hard limit so this worker cannot push the
    # whole VPS into a swap storm.
    mem_limit: ${WORKER_MEMORY_LIMIT:-1536m}
    mem_reservation: ${WORKER_MEMORY_RESERVATION:-512m}
    memswap_limit: ${WORKER_MEMORY_LIMIT:-1536m}
    cpus: ${WORKER_CPU_LIMIT:-2.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-256}
