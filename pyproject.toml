[project]
name = "media-pocket"
version = "0.1.0"
description = "Invite-only self-hosted Telegram media downloader"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "aiogram==3.30.0",
    "aiohttp==3.14.3",
    "SQLAlchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "redis==8.1.0",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.3",
    "yt-dlp[default,curl-cffi]==2026.8.19",
    "bgutil-ytdlp-pot-provider==1.3.2",
]

[dependency-groups]
dev = [
    "prek==0.4.14",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "ty==0.0.74",
]

[tool.uv]
package = false
