[package]
name = "spotify-streamer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
futures = "0.3"
librespot = { path = "../../third_party/librespot", default-features = false, features = ["rustls-tls-webpki-roots"] }
log = "0.4"
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "reqwest-blocking", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "system-proxy"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres = "0.7"
url = "2.5"
